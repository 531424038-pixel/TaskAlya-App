<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Daily Task - To-Do List Kegiatan Harian. Offline, tanpa login." />
  <title>Daily Task - To-Do List Kegiatan Harian</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== Header ===== -->
  <header class="app-header">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">✓</span>
      <div class="brand-text">
        <h1>Daily Task</h1>
        <p class="brand-sub">To-Do List Kegiatan Harian</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="btn-theme" class="icon-btn" type="button"
              title="Ganti mode gelap/terang" aria-label="Ganti mode gelap terang">🌙</button>
      <button id="btn-add" class="btn btn-primary" type="button">＋ Tambah Tugas</button>
    </div>
  </header>

  <main class="container">
    <!-- ===== Navigasi tanggal + progres harian ===== -->
    <section class="card">
      <div class="date-nav">
        <button id="btn-prev" class="icon-btn" type="button" aria-label="Hari sebelumnya">‹</button>
        <div class="date-display">
          <span id="date-label" class="date-label">—</span>
          <input type="date" id="date-input" aria-label="Pilih tanggal" />
        </div>
        <button id="btn-next" class="icon-btn" type="button" aria-label="Hari berikutnya">›</button>
        <button id="btn-today" class="btn btn-ghost" type="button">Hari ini</button>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-text" class="progress-text">0 dari 0 tugas selesai</p>
      </div>
    </section>

    <!-- ===== Pencarian, filter status, tools ===== -->
    <section class="card toolbar">
      <input type="search" id="search-input" class="search-input"
             placeholder="Cari judul tugas..." aria-label="Cari judul tugas" autocomplete="off" />

      <div class="filter-group" role="group" aria-label="Filter status">
        <button class="filter-btn active" type="button" data-filter="semua">Semua</button>
        <button class="filter-btn" type="button" data-filter="aktif">Aktif</button>
        <button class="filter-btn" type="button" data-filter="selesai">Selesai</button>
      </div>

      <div class="tool-group">
        <button id="btn-export" class="btn btn-ghost" type="button">⬇ Ekspor</button>
        <button id="btn-import" class="btn btn-ghost" type="button">⬆ Impor</button>
        <label class="toggle-label" title="Pengingat Notification API">
          <input type="checkbox" id="toggle-reminder" />
          <span>🔔 Pengingat</span>
        </label>
      </div>
    </section>

    <!-- ===== Daftar tugas + empty state ===== -->
    <section class="list-section">
      <ul id="task-list" class="task-list"></ul>
      <div id="empty-state" class="empty-state" hidden>
        <span class="empty-icon" aria-hidden="true">🗒️</span>
        <h2 id="empty-title">Belum ada tugas</h2>
        <p id="empty-desc">Tambahkan tugas pertama Anda dengan tombol “＋ Tambah Tugas”.</p>
      </div>
    </section>
  </main>

  <!-- ===== Modal form tambah/edit ===== -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="form-title">
      <h2 id="form-title">Tambah Tugas</h2>
      <form id="task-form" novalidate>
        <input type="hidden" id="in-id" />

        <div class="field">
          <label for="in-title">Judul tugas <span class="req" aria-hidden="true">*</span></label>
          <input type="text" id="in-title" maxlength="200"
                 placeholder="Contoh: Kerjakan laporan praktikum" autocomplete="off" />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="in-date">Tanggal <span class="req" aria-hidden="true">*</span></label>
            <input type="date" id="in-date" />
          </div>
          <div class="field">
            <label for="in-time">Jam (opsional)</label>
            <input type="time" id="in-time" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="in-priority">Prioritas</label>
            <select id="in-priority">
              <option value="low">Rendah</option>
              <option value="medium" selected>Sedang</option>
              <option value="high">Tinggi</option>
            </select>
          </div>
          <div class="field">
            <label for="in-category">Kategori</label>
            <select id="in-category">
              <option value="Kerja">Kerja</option>
              <option value="Pribadi">Pribadi</option>
              <option value="Belajar">Belajar</option>
            </select>
          </div>
        </div>

        <p id="form-error" class="form-error" hidden></p>

        <div class="modal-actions">
          <button type="button" id="btn-cancel" class="btn btn-ghost">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Hidden input impor file + toast notifikasi -->
  <input type="file" id="import-file" accept="application/json,.json" hidden />
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="script.js"></script>
</body>
</html>
